<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spread Wing</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
  body.hide-ui .lil-gui, body.hide-ui #hint { display: none !important; }
  #hint {
    position: fixed; left: 12px; bottom: 10px;
    font: 11px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
    color: rgba(255,255,255,.35); user-select: none; pointer-events: none;
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hint">이미지 드롭: 1장 → 앞면, 2장 → 앞·뒷면 · H: UI 숨기기 · A: 축 표시 · F: 전체 화면 · 드래그: 회전 · 휠: 줌</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import GUI from 'three/addons/libs/lil-gui.module.min.js';

// ---- 파라미터 ---------------------------------------------------------
const params = {
  maxAngle: 55,      // 최대 접힘 각도 (deg). 0 = 완전히 펼침, +위 / -아래
  frequency: 1.1,    // 날갯짓 빈도 (Hz)
  upDownBias: 0.15,  // 위/아래 비대칭 (0 = 대칭)
  scale: 1.0,        // 스프레드 크기
  light: 1.0,        // 조명 강도
  background: '#000000',
};

// ---- 렌더러 / 장면 / 카메라 ------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(params.background);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 200);
camera.position.set(3.2, 3.4, 4.6);          // 위에서 비스듬히 내려다봄
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

// ---- 조명: 무광 종이의 명암이 드러나도록 ---------------------------
const hemi = new THREE.HemisphereLight(0xffffff, 0x666666, 0.6);
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(2, 5, 1.5);
const fill = new THREE.DirectionalLight(0xffffff, 0.6);
fill.position.set(-3, -1, -2);
scene.add(hemi, key, fill);
function applyLight() {
  hemi.intensity = 0.6 * params.light;
  key.intensity = 2.2 * params.light;
  fill.intensity = 0.6 * params.light;
}

// ---- 스프레드 지오메트리 ---------------------------------------------
// 한 페이지 140 × 220 mm → 단위: 1 = 100 mm. 펼침 280 × 220.
// 접지선(spine)은 Z축 위(x = 0), 진행 방향과 평행.
// 왼쪽 페이지 x∈[-1.4,0], 오른쪽 페이지 x∈[0,1.4], z∈[-1.1,1.1]
const PW = 1.4, PH = 2.2;
function makeSpreadGeometry() {
  const pos = [], uv = [], side = [], idx = [];
  const quad = (x0, x1, u0, u1, s) => {
    const b = pos.length / 3;
    // 이미지 위쪽(v=1) = 진행 방향(-Z)
    pos.push(x0, 0, -PH / 2,  x1, 0, -PH / 2,  x1, 0, PH / 2,  x0, 0, PH / 2);
    uv.push(u0, 1,  u1, 1,  u1, 0,  u0, 0);
    side.push(s, s, s, s);
    idx.push(b, b + 2, b + 1,  b, b + 3, b + 2); // 윗면(+Y)이 앞면
  };
  quad(-PW, 0, 0.0, 0.5, -1); // 왼쪽 페이지 ← 이미지 왼쪽 절반
  quad(0, PW, 0.5, 1.0, 1);   // 오른쪽 페이지 ← 이미지 오른쪽 절반
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('aSide', new THREE.Float32BufferAttribute(side, 1));
  g.setIndex(idx);
  g.computeVertexNormals();
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 2.0);
  return g;
}

// ---- 머티리얼: 버텍스 셰이더에서 강체 회전 ---------------------------
// 각 페이지는 접지선을 축으로 θ만큼 강체 회전한다 (휘거나 늘어나지 않음).
//   x' = x·cosθ,  y' = |x|·sinθ
//   n' = (-side·sinθ, cosθ, 0)
const blankTex = new THREE.DataTexture(new Uint8Array([255, 255, 255, 255]), 1, 1);
blankTex.needsUpdate = true;
const uniforms = {
  uAngle:    { value: 0 },
  uFront:    { value: blankTex },
  uBack:     { value: blankTex },
  uHasFront: { value: 0 },
  uHasBack:  { value: 0 },
  uFrontFit: { value: new THREE.Vector2(1, 1) },
  uBackFit:  { value: new THREE.Vector2(1, 1) },
};
const material = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  roughness: 1.0,
  metalness: 0.0,
  side: THREE.DoubleSide,
});
material.onBeforeCompile = (shader) => {
  Object.assign(shader.uniforms, uniforms);
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', `#include <common>
      attribute float aSide;
      uniform float uAngle;
      varying vec2 vSpreadUv;`)
    .replace('#include <uv_vertex>', `#include <uv_vertex>
      vSpreadUv = uv;`)
    .replace('#include <beginnormal_vertex>', `
      float cA = cos(uAngle), sA = sin(uAngle);
      vec3 objectNormal = vec3(-aSide * sA, cA, 0.0);
      #ifdef USE_TANGENT
        vec3 objectTangent = vec3(tangent.xyz);
      #endif`)
    .replace('#include <begin_vertex>', `
      vec3 transformed = vec3(position.x * cA, abs(position.x) * sA, position.z);`);

  // 앞면(+Y)과 뒷면에 서로 다른 텍스처.
  // 이미지 왼쪽 절반 → 왼쪽 페이지, 오른쪽 절반 → 오른쪽 페이지.
  // 뒷면은 아래에서 봤을 때 바르게 읽히도록 좌우를 뒤집어 매핑.
  // fit: 이미지 비율을 유지(늘리지 않음)하기 위한 UV 스케일. 범위 밖은 종이 흰색.
  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', `#include <common>
      varying vec2 vSpreadUv;
      uniform sampler2D uFront, uBack;
      uniform float uHasFront, uHasBack;
      uniform vec2 uFrontFit, uBackFit;`)
    .replace('#include <map_fragment>', `
      {
        bool isFront = gl_FrontFacing;
        vec2 suv = vSpreadUv;
        if (!isFront) suv.x = 1.0 - suv.x;
        vec2 fit = isFront ? uFrontFit : uBackFit;
        vec2 tuv = (suv - 0.5) * fit + 0.5;
        float inside = step(0.0, tuv.x) * step(tuv.x, 1.0) * step(0.0, tuv.y) * step(tuv.y, 1.0);
        vec4 tf = texture2D(uFront, tuv);
        vec4 tb = texture2D(uBack, tuv);
        vec4 texel = isFront ? tf : tb;
        float has = (isFront ? uHasFront : uHasBack) * inside;
        diffuseColor.rgb *= mix(vec3(1.0), texel.rgb, has);
      }`);
};

const spread = new THREE.Mesh(makeSpreadGeometry(), material);
scene.add(spread);

// ---- XYZ 축 (블렌더 스타일: X 빨강, Y 초록, Z 파랑) -------------------
// 개체 중심(원점)을 지나는 양방향 직선. 양(+)쪽은 선명하게, 음(−)쪽은 어둡게.
const AXIS_LEN = 6;
const axisColors = { x: 0xff3352, y: 0x8bdc00, z: 0x2890ff };
function makeAxes() {
  const group = new THREE.Group();
  const pos = [], col = [];
  const dirs = { x: [1, 0, 0], y: [0, 1, 0], z: [0, 0, 1] };
  const c = new THREE.Color(), dim = new THREE.Color();
  for (const k of ['x', 'y', 'z']) {
    const [dx, dy, dz] = dirs[k];
    c.set(axisColors[k]);
    dim.copy(c).multiplyScalar(0.5);
    // + 방향
    pos.push(0, 0, 0, dx * AXIS_LEN, dy * AXIS_LEN, dz * AXIS_LEN);
    col.push(c.r, c.g, c.b, c.r, c.g, c.b);
    // − 방향
    pos.push(0, 0, 0, -dx * AXIS_LEN, -dy * AXIS_LEN, -dz * AXIS_LEN);
    col.push(dim.r, dim.g, dim.b, dim.r, dim.g, dim.b);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  const lines = new THREE.LineSegments(g, new THREE.LineBasicMaterial({
    vertexColors: true, depthWrite: false,
  }));
  group.add(lines);

  // 축 끝 라벨
  const LABEL_AT = 1.9;
  for (const k of ['x', 'y', 'z']) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = 64;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#' + new THREE.Color(axisColors[k]).getHexString();
    ctx.font = '600 44px -apple-system, Helvetica, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(k.toUpperCase(), 32, 34);
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthWrite: false }));
    sp.scale.setScalar(0.22);
    const [dx, dy, dz] = dirs[k];
    sp.position.set(dx * LABEL_AT, dy * LABEL_AT, dz * LABEL_AT);
    group.add(sp);
  }
  return group;
}
const axes = makeAxes();
scene.add(axes);

// ---- 날갯짓 -----------------------------------------------------------
// 위상 φ에 대해 θ = A·(sin φ + b·sin 2φ)/norm  — 약간의 비대칭으로 생물적인 느낌
let phase = 0;
function flapAngle(p) {
  const b = params.upDownBias;
  const raw = Math.sin(p) + b * Math.sin(2 * p);
  const norm = 1 + b * 0.6; // 대략적인 최대값 보정
  return THREE.MathUtils.degToRad(params.maxAngle) * raw / norm;
}

// ---- 텍스처 업로드 ---------------------------------------------------
const SPREAD_ASPECT = (PW * 2) / PH; // 280 / 220
const texState = {
  fit: 'contain',            // contain: 전체 보이기(여백) · cover: 꽉 채우기(일부 잘림)
  front: null, back: null,   // { tex, aspect }
  backSameAsFront: false,
};
function fitScale(aspect, out) {
  if (!aspect) return out.set(1, 1);
  const r = aspect / SPREAD_ASPECT; // >1: 이미지가 더 넓음
  if (texState.fit === 'contain') return r > 1 ? out.set(1, r) : out.set(1 / r, 1);
  return r > 1 ? out.set(1 / r, 1) : out.set(1, r);
}
function refreshTextures() {
  const f = texState.front;
  const b = texState.backSameAsFront ? texState.front : texState.back;
  uniforms.uFront.value = f ? f.tex : blankTex;
  uniforms.uHasFront.value = f ? 1 : 0;
  fitScale(f?.aspect, uniforms.uFrontFit.value);
  uniforms.uBack.value = b ? b.tex : blankTex;
  uniforms.uHasBack.value = b ? 1 : 0;
  fitScale(b?.aspect, uniforms.uBackFit.value);
}
async function loadImageFile(file) {
  const bitmap = await createImageBitmap(file, { imageOrientation: 'flipY' });
  const tex = new THREE.Texture(bitmap);
  tex.flipY = false; // 이미 flipY 된 비트맵
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.generateMipmaps = true;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.needsUpdate = true;
  return { tex, aspect: bitmap.width / bitmap.height, bitmap };
}
function disposeSlot(slot) {
  const s = texState[slot];
  if (!s) return;
  s.tex.dispose();
  s.bitmap.close?.();
  texState[slot] = null;
}
async function setSlot(slot, file) {
  if (!file || !file.type.startsWith('image/')) return;
  try {
    const loaded = await loadImageFile(file);
    disposeSlot(slot);
    texState[slot] = loaded;
    refreshTextures();
  } catch (err) {
    console.error('이미지를 불러오지 못했습니다:', err);
  }
}
function pickFile(slot) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/jpeg,image/png,image/webp';
  input.onchange = () => setSlot(slot, input.files[0]);
  input.click();
}
// 드래그 앤 드롭: 파일 1개 → 앞면, 2개 → 앞면 + 뒷면
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', (e) => {
  e.preventDefault();
  const files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
  if (files[0]) setSlot('front', files[0]);
  if (files[1]) setSlot('back', files[1]);
});

// ---- GUI --------------------------------------------------------------
const gui = new GUI({ title: 'Spread Wing' });
const fw = gui.addFolder('날갯짓');
fw.add(params, 'maxAngle', 0, 85, 1).name('최대 접힘 각도 (°)');
fw.add(params, 'frequency', 0, 4, 0.01).name('날갯짓 빈도 (Hz)');
fw.add(params, 'upDownBias', 0, 0.5, 0.01).name('위/아래 비대칭');
const ft = gui.addFolder('텍스처');
ft.add({ f() { pickFile('front'); } }, 'f').name('앞면 이미지 업로드');
ft.add({ f() { pickFile('back'); } }, 'f').name('뒷면 이미지 업로드');
ft.add(texState, 'backSameAsFront').name('뒷면 = 앞면').onChange(refreshTextures);
ft.add(texState, 'fit', { '전체 보이기 (여백)': 'contain', '꽉 채우기 (잘림)': 'cover' })
  .name('이미지 맞춤').onChange(refreshTextures);
ft.add({ f() { disposeSlot('front'); disposeSlot('back'); refreshTextures(); } }, 'f').name('이미지 제거');
const fv = gui.addFolder('시각 요소');
fv.add(params, 'scale', 0.3, 3, 0.01).name('스프레드 크기').onChange(v => spread.scale.setScalar(v));
fv.add(params, 'light', 0, 2, 0.01).name('조명 강도').onChange(applyLight);
fv.addColor(params, 'background').name('배경색').onChange(v => scene.background.set(v));
fv.add(axes, 'visible').name('XYZ 축 표시 (A)').listen();
fv.add(camera, 'fov', 10, 90, 1).name('카메라 원근감 (FOV)').onChange(() => camera.updateProjectionMatrix());
fv.add({ reset() { camera.position.set(3.2, 3.4, 4.6); controls.target.set(0, 0, 0); } }, 'reset').name('카메라 초기화');

// ---- 키 / 리사이즈 ---------------------------------------------------
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('hide-ui');
  if (e.key === 'a' || e.key === 'A') axes.visible = !axes.visible;
  if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---- 루프 -------------------------------------------------------------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  phase = (phase + dt * params.frequency * Math.PI * 2) % (Math.PI * 2);
  uniforms.uAngle.value = flapAngle(phase);
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
