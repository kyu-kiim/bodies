<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spread Flock</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
  body.hide-ui .lil-gui, body.hide-ui #hint, body.hide-ui #toast { display: none !important; }
  body.hide-ui { cursor: none; }
  #hint {
    position: fixed; left: 12px; bottom: 10px;
    font: 11px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
    color: rgba(255,255,255,.35); user-select: none; pointer-events: none;
  }
  #toast {
    position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%);
    font: 12px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
    color: #ddd; background: rgba(30,30,30,.9); padding: 6px 12px; border-radius: 4px;
    opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 80vw;
  }
  #toast.show { opacity: 1; }
  #toast.err { color: #ffb4b4; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hint">마우스: 군집이 따라옴 · 오른쪽 버튼: 밀어내기 · 더블클릭: 흩어짐 · 드래그: 카메라 회전 · 휠: 줌 · 이미지 드롭 → 빈 타입(A, B, C…)에 차례로 · H: UI 숨기기 · F: 전체 화면</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import GUI from 'three/addons/libs/lil-gui.module.min.js';

// =====================================================================
// 파라미터
// =====================================================================
const MAX = 3000;          // 최대 개체 수 (버퍼는 한 번만 할당)
const TYPE_LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];

// 군집 파라미터는 기존 bodies 사이트(js/opt.js)의 기본값을 그대로 사용한다.
// 단위도 원본과 같다: 거리 = px, 속도 = px/frame(60fps 기준), 힘 = px/frame².
// 3D 공간에서는 1px = 0.1 unit(= 1mm × 10)으로 그린다 → 스프레드 폭 280mm = 28px.
const params = {
  // 군집 (원본 opt.js 기본값)
  count: 200,
  vision: 60,          // 주변 개체 인식 반경
  alignment: 1.8,
  bias: 1.5,           // 정렬 편향: 같은 방향으로 나는 이웃일수록 더 강하게 따름
  cohesion: 1.0,
  separation: 1.5,
  maxForce: 0.2,       // 최대 회전(조향) 힘
  minSpeed: 1,
  maxSpeed: 4,         // 이동 속도
  drag: 0.005,
  noise: 0.5,
  accuracyPower: 5,    // 이웃 표본 수 = 2^p (10 = 전부)
  bounce: false,       // 경계: false = 반대편으로 이어짐(원본 기본), true = 튕김
  space: 1.0,          // 활동 공간 크기 (1 = 카메라 화면 전체)
  spacing: 2.0,        // 개체 간격: 시뮬레이션 1px을 3D에서 얼마나 길게 그릴지 (클수록 서로 멀리 보임)
  mouseFollow: true,   // 마우스를 향해 끌림 (원본: 왼쪽 버튼 = 끌기, 오른쪽 = 밀기)
  // 군무 (마우스가 조종하지 않을 때): 노이즈로 움직이는 보이지 않는 리더를 따라 무리 지어 춤춘다
  choreo: true,
  choreoIdle: 3,       // 마우스가 멈추고 몇 초 뒤 군무로 돌아갈지
  choreoStrength: 1.0, // 리더에게 모이는 힘 (클수록 촘촘한 한 덩어리)
  choreoSpeed: 1.0,    // 리더가 화면을 휘젓는 속도
  choreoRange: 1.0,    // 리더가 돌아다니는 범위 (1 = 화면 끝까지, 가끔 화면 밖으로)
  choreoTrail: 2.5,     // 무리가 리더의 지나온 길을 따라 길게 늘어지는 정도 (0 = 한 덩어리)
  choreoSwirl: 0.6,    // 리더 주위를 도는 소용돌이 (방향은 천천히 바뀜)
  choreoBreath: 14,    // 모였다 흩어지는 호흡 주기(초)
  // 날갯짓
  maxAngle: 55,
  frequency: 1.6,
  phaseVar: 1.0,       // 개체별 위상 차이 (0~1)
  freqVar: 0.25,       // 개체별 날갯짓 속도 편차
  sync: 0.15,          // 동기화 정도
  upDownBias: 0.15,
  // 시각
  scale: 0.55,         // 스프레드 크기 (1 = 280 × 220mm 실제 비율 기준 크기)
  light: 1.0,
  background: '#000000',
};

// =====================================================================
// 렌더러 / 장면 / 카메라 / 조명
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(params.background);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 2000);
const DEFAULT_CAM = new THREE.Vector3(0, 27, 40); // 위에서 비스듬히 내려다봄
camera.position.copy(DEFAULT_CAM);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false; // 오른쪽 버튼은 원본처럼 '밀어내기'에 사용

const hemi = new THREE.HemisphereLight(0xffffff, 0x666666, 0.6);
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(2, 5, 1.5);
const fill = new THREE.DirectionalLight(0xffffff, 0.6);
fill.position.set(-3, -1, -2);
scene.add(hemi, key, fill);
function applyLight() {
  hemi.intensity = 0.6 * params.light;
  key.intensity = 2.2 * params.light;
  fill.intensity = 0.6 * params.light;
}

// =====================================================================
// 스프레드 지오메트리 (140×220mm 페이지 2장, 접지선 = 로컬 Z축)
// 로컬 −Z = 진행 방향(이미지 위쪽), +Y = 앞면
// =====================================================================
const PW = 1.4, PH = 2.2;
function makeSpreadGeometry() {
  const g = new THREE.BufferGeometry();
  const pos = [], uv = [], side = [], idx = [];
  const quad = (x0, x1, u0, u1, s) => {
    const b = pos.length / 3;
    pos.push(x0, 0, -PH / 2,  x1, 0, -PH / 2,  x1, 0, PH / 2,  x0, 0, PH / 2);
    uv.push(u0, 1,  u1, 1,  u1, 0,  u0, 0);
    side.push(s, s, s, s);
    idx.push(b, b + 2, b + 1,  b, b + 3, b + 2);
  };
  quad(-PW, 0, 0.0, 0.5, -1);
  quad(0, PW, 0.5, 1.0, 1);
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(new Array(pos.length).fill(0).map((_, i) => (i % 3 === 1 ? 1 : 0)), 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('aSide', new THREE.Float32BufferAttribute(side, 1));
  g.setIndex(idx);
  return g;
}
const geometry = makeSpreadGeometry();

// 개체별 속성: 접힘 각도(매 프레임), 앞면 타입(레이어 번호, −1 = 흰 종이)
const aAngle = new THREE.InstancedBufferAttribute(new Float32Array(MAX), 1);
aAngle.setUsage(THREE.DynamicDrawUsage);
const aType = new THREE.InstancedBufferAttribute(new Float32Array(MAX).fill(-1), 1);
geometry.setAttribute('aAngle', aAngle);
geometry.setAttribute('aType', aType);

// =====================================================================
// 앞면 텍스처: Texture Array (레이어 하나 = 타입 하나)
// 서로 다른 크기의 이미지를 같은 크기 레이어에 비율 유지(contain)로 그려 넣는다.
// =====================================================================
const LAYER_W = 1024, LAYER_H = Math.round(1024 * PH / (PW * 2)); // 1024 × 805 (280:220)
const layerData = new Uint8Array(LAYER_W * LAYER_H * 4 * TYPE_LETTERS.length).fill(255);
const texArray = new THREE.DataArrayTexture(layerData, LAYER_W, LAYER_H, TYPE_LETTERS.length);
texArray.colorSpace = THREE.SRGBColorSpace;
texArray.generateMipmaps = true;
texArray.minFilter = THREE.LinearMipmapLinearFilter;
texArray.magFilter = THREE.LinearFilter;
texArray.anisotropy = renderer.capabilities.getMaxAnisotropy();
texArray.needsUpdate = true;

const material = new THREE.MeshStandardMaterial({
  color: 0xffffff, roughness: 1.0, metalness: 0.0, side: THREE.DoubleSide,
});
material.onBeforeCompile = (shader) => {
  shader.uniforms.uTexArr = { value: texArray };
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', `#include <common>
      attribute float aSide;
      attribute float aAngle;
      attribute float aType;
      varying vec2 vSpreadUv;
      varying float vType;`)
    .replace('#include <uv_vertex>', `#include <uv_vertex>
      vSpreadUv = uv;
      vType = aType;`)
    // 각 페이지는 접지선을 축으로 강체 회전 (휘거나 늘어나지 않음)
    .replace('#include <beginnormal_vertex>', `
      float cA = cos(aAngle), sA = sin(aAngle);
      vec3 objectNormal = vec3(-aSide * sA, cA, 0.0);
      #ifdef USE_TANGENT
        vec3 objectTangent = vec3(tangent.xyz);
      #endif`)
    .replace('#include <begin_vertex>', `
      vec3 transformed = vec3(position.x * cA, abs(position.x) * sA, position.z);`);
  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', `#include <common>
      uniform highp sampler2DArray uTexArr;
      varying vec2 vSpreadUv;
      varying float vType;`)
    .replace('#include <map_fragment>', `
      if (gl_FrontFacing && vType > -0.5) {
        vec4 t = texture(uTexArr, vec3(vSpreadUv, floor(vType + 0.5)));
        diffuseColor.rgb *= t.rgb;
      }`);
};

const mesh = new THREE.InstancedMesh(geometry, material, MAX);
mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
mesh.frustumCulled = false;
mesh.count = params.count;
scene.add(mesh);

// =====================================================================
// Boids — 기존 bodies 사이트(js/boid.js, js/flock.js, js/main.js)의 모델을 3D로 그대로 옮김
//   update():   vel += acc·Δ → drag → noise 회전 → 최소/최대 속도 → pos += vel·Δ → 경계
//   organize(): vision 크기 버킷에 분류
//   flock():    정렬(bias^dot 가중) · 응집 · 분리(1/d²) → 각각 setMag(maxSpeed) − vel, maxForce 제한
//   interact(): 마우스 끌기/밀기, 더블클릭 폭발
// Δ = 60fps 기준 프레임 수 (원본 PIXI ticker delta, 최대 2)
// =====================================================================
// ---- 활동 공간 = 화면 (원본처럼) ---------------------------------------
// 시뮬레이션 공간의 x·y축을 기본 카메라 화면의 가로·세로에, z축을 깊이에 맞춘다.
// 크기는 카메라에서 보이는 영역(공간 중간보다 조금 먼 깊이 기준)에 맞춰 계산 → 군집이 화면 전체를
// 돌아다니고, 반대편으로 이어지는 지점(경계)은 화면 밖에 놓인다.
// 1px이 3D에서 차지하는 길이 = PX × 개체 간격(spacing)
const PX = 0.1;
const SIM_Q = (() => {
  const c = new THREE.PerspectiveCamera();
  c.position.copy(DEFAULT_CAM);
  c.lookAt(0, 0, 0);
  return c.quaternion.clone();
})();
const SIM_Q_INV = SIM_Q.clone().invert();
const SIM_M = new THREE.Matrix3().setFromMatrix4(new THREE.Matrix4().makeRotationFromQuaternion(SIM_Q)).elements; // 열 우선
const dims = [0, 0, 0];
const worldPerPx = () => PX * params.spacing;
let visFrac = 0.7;
function updateDims() {
  const L = DEFAULT_CAM.length();
  const depthW = L * 0.5 * params.space;                        // 공간의 깊이 (world)
  const far = L + depthW * 0.5;             // 가장 깊은 곳에서도 화면을 다 덮도록 (경계가 화면 안에 보이지 않게)
  const halfH = far * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * params.space * 1.1;
  // 화면 중앙 깊이에서 실제로 보이는 범위가 공간의 몇 % 인지 (리더 이동 범위 계산용)
  visFrac = L / (far * 1.1);
  const halfW = halfH * (innerWidth / innerHeight);
  const margin = 1.6 * params.scale;                             // 스프레드가 화면 밖에서 넘어가도록
  const k = 1 / worldPerPx();
  dims[0] = (2 * halfW + 2 * margin) * k;
  dims[1] = (2 * halfH + 2 * margin) * k;
  dims[2] = depthW * k;
}
// 공간 크기가 바뀌면 위치를 비율대로 옮겨 군집이 끊기지 않게 함
function rescaleSpace() {
  const old = dims.slice();
  updateDims();
  for (let i = 0; i < MAX; i++) for (let k = 0; k < 3; k++) P[i * 3 + k] *= dims[k] / (old[k] || dims[k]);
}
updateDims();

const P = new Float64Array(MAX * 3);    // 위치 (px, 0..dims)
const V = new Float64Array(MAX * 3);    // 속도 (px/frame)
const ACC = new Float64Array(MAX * 3);  // 가속 (원본처럼 다음 프레임 update에서 사용)
const phase = new Float32Array(MAX);
const ampS = new Float32Array(MAX).fill(0.7);
const bank = new Float32Array(MAX);
const uPhase = new Float32Array(MAX);
const uFreq = new Float32Array(MAX);
const uAmp = new Float32Array(MAX);
const uType = new Float32Array(MAX);
const quat = Array.from({ length: MAX }, () => new THREE.Quaternion());
const prevRight = new Float32Array(MAX * 3);

// 원본 V2D.random(mag): 임의 방향, 크기 mag (3D에서는 구면 위 균등 방향)
function randomDir(out, o, mag) {
  const z = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2, r = Math.sqrt(1 - z * z);
  out[o] = r * Math.cos(t) * mag; out[o + 1] = r * Math.sin(t) * mag; out[o + 2] = z * mag;
}
function resetBoid(i) {
  const i3 = i * 3;
  P[i3] = Math.random() * dims[0]; P[i3 + 1] = Math.random() * dims[1]; P[i3 + 2] = Math.random() * dims[2];
  randomDir(V, i3, params.minSpeed + Math.random() * (params.maxSpeed - params.minSpeed));
  ACC[i3] = ACC[i3 + 1] = ACC[i3 + 2] = 0;
}
for (let i = 0; i < MAX; i++) {
  resetBoid(i);
  uPhase[i] = Math.random();
  uFreq[i] = Math.random() * 2 - 1;
  uAmp[i] = Math.random() * 2 - 1;
  uType[i] = Math.random();
  phase[i] = Math.random() * Math.PI * 2;
  prevRight.set([1, 0, 0], i * 3);
}

// ---- organize(): vision 크기의 버킷 (원본 flock.js의 buckets를 3D 배열로) ----
let gCols = 0, gRows = 0, gLays = 0, gScale = 0;
let cellStart = new Int32Array(1), cellCursor = new Int32Array(1);
const cellOf = new Int32Array(MAX);
const sorted = new Int32Array(MAX);
function organize(n) {
  const s = params.vision;
  const c = Math.ceil(dims[0] / s), r = Math.ceil(dims[1] / s), l = Math.ceil(dims[2] / s);
  if (c !== gCols || r !== gRows || l !== gLays || s !== gScale) {
    gCols = c; gRows = r; gLays = l; gScale = s;
    cellStart = new Int32Array(c * r * l + 1);
    cellCursor = new Int32Array(c * r * l);
  } else cellStart.fill(0);
  for (let i = 0; i < n; i++) {
    const i3 = i * 3;
    const cx = Math.min(c - 1, Math.max(0, Math.floor(P[i3] / s)));
    const cy = Math.min(r - 1, Math.max(0, Math.floor(P[i3 + 1] / s)));
    const cz = Math.min(l - 1, Math.max(0, Math.floor(P[i3 + 2] / s)));
    const h = (cz * r + cy) * c + cx;
    cellOf[i] = h;
    cellStart[h + 1]++;
  }
  const N = c * r * l;
  for (let h = 0; h < N; h++) cellStart[h + 1] += cellStart[h];
  cellCursor.set(cellStart.subarray(0, N));
  for (let i = 0; i < n; i++) sorted[cellCursor[cellOf[i]]++] = i;
}

// ---- 마우스 (원본 events.js / boid.interact) ----
// 마우스 위치는 카메라를 향하는 평면(공간 중심을 지남)과의 교점으로 3D 좌표를 얻는다.
const mouse = { x: 0, y: 0, z: 0, over: false, down: false, button: 0, moved: -1e9 };
const ndc = new THREE.Vector2();
const raycaster = new THREE.Raycaster();
const plane = new THREE.Plane();
const _camDir = new THREE.Vector3(), _hit = new THREE.Vector3();
let explode = 0;
const explodePos = [0, 0, 0];
renderer.domElement.addEventListener('pointermove', (e) => {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  mouse.over = true; mouse.moved = performance.now();
});
renderer.domElement.addEventListener('pointerleave', () => { mouse.over = false; });
renderer.domElement.addEventListener('pointerdown', (e) => { mouse.down = true; mouse.button = e.button; });
addEventListener('pointerup', () => { mouse.down = false; });
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
renderer.domElement.addEventListener('dblclick', () => {
  explode = 1; explodePos[0] = mouse.x; explodePos[1] = mouse.y; explodePos[2] = mouse.z;
});
function updateMouse() {
  camera.getWorldDirection(_camDir);
  plane.setFromNormalAndCoplanarPoint(_camDir, controls.target);
  raycaster.setFromCamera(ndc, camera);
  if (raycaster.ray.intersectPlane(plane, _hit)) {
    _hit.applyQuaternion(SIM_Q_INV); // world → 시뮬레이션 축
    const k = 1 / worldPerPx();
    mouse.x = _hit.x * k + dims[0] / 2;
    mouse.y = _hit.y * k + dims[1] / 2;
    mouse.z = _hit.z * k + dims[2] / 2;
  }
}

// ---- 시뮬레이션 한 프레임 (원본 Flock.update 순서) ----
const TAU = Math.PI * 2;
let globalSin = 0, globalCos = 1;
function wave(p) {
  const b = params.upDownBias;
  return (Math.sin(p) + b * Math.sin(2 * p)) / (1 + b * 0.6);
}
// setMag(maxSpeed) − vel, 크기를 maxForce로 제한 (V2D.setMag / V2D.max와 동일)
const _st = [0, 0, 0];
function steerTo(x, y, z, vx, vy, vz, ms, mf) {
  const l2 = x * x + y * y + z * z;
  const k = l2 > 0 ? ms / Math.sqrt(l2) : 0;
  let sx = x * k - vx, sy = y * k - vy, sz = z * k - vz;
  const m2 = sx * sx + sy * sy + sz * sz;
  if (m2 > mf * mf) { const q = mf / Math.sqrt(m2); sx *= q; sy *= q; sz *= q; }
  _st[0] = sx; _st[1] = sy; _st[2] = sz;
}

// ---- 군무: 노이즈 경로를 따라 움직이는 리더 -------------------------
// 서로 다른 주기의 사인을 겹친 부드러운 노이즈(반복이 거의 보이지 않음)
const NZ = Array.from({ length: 9 }, () => [0.5 + Math.random(), Math.random() * Math.PI * 2]);
const noise1 = (t, o) => (Math.sin(t * NZ[o][0] * 0.23 + NZ[o][1]) * 0.55
  + Math.sin(t * NZ[o + 1][0] * 0.51 + NZ[o + 1][1]) * 0.3
  + Math.sin(t * NZ[o + 2][0] * 1.13 + NZ[o + 2][1]) * 0.15);
const choreo = { x: 0, y: 0, z: 0, w: 1, t: Math.random() * 1000, pull: 1, swirl: 0, trail: 0 };
// 리더 경로: 시간 t의 함수라서 과거 위치도 바로 계산 가능 → 개체마다 조금씩 늦은 지점을 따라가면 리본처럼 늘어짐
const _lp = [0, 0, 0];
function leaderAt(t) {
  const r = params.choreoRange * 0.5 * visFrac;
  _lp[0] = dims[0] * (0.5 + r * noise1(t, 0) * 1.1);
  _lp[1] = dims[1] * (0.5 + r * noise1(t * 1.17, 3) * 1.1);
  _lp[2] = dims[2] * (0.5 + 0.4 * noise1(t * 0.83, 6));

const lag = Float32Array.from({ length: MAX }, () => Math.random() ** 1.5); // 대부분 앞쪽, 일부가 꼬리
function updateChoreo(dt) {
  const c = choreo;
  c.t += dt * params.choreoSpeed;
  leaderAt(c.t); c.x = _lp[0]; c.y = _lp[1]; c.z = _lp[2];
  // 호흡: 천천히 모였다(1) 느슨해졌다(0.4)를 반복
  const ph = params.choreoBreath > 0 ? Math.sin((simT * Math.PI * 2) / params.choreoBreath) : 1;
  c.pull = 0.4 + 0.6 * (0.5 + 0.5 * ph);
  // 흩어질 때는 꼬리가 길게, 모일 때는 짧게
  c.trail = params.choreoTrail * (1.25 - 0.75 * (0.5 + 0.5 * ph));
  // 소용돌이 방향은 노이즈로 천천히 뒤집힘
  c.swirl = params.choreoSwirl * Math.tanh(2.5 * Math.sin(simT * 0.045 + 1.3));

  const idle = !(params.mouseFollow && mouse.over && performance.now() - mouse.moved < params.choreoIdle * 1000);

function stepBoids(delta) {
  const n = params.count;
  const W = dims[0], H = dims[1], D = dims[2];
  const { drag, minSpeed, maxSpeed, maxForce, alignment, cohesion, separation, bias } = params;
  const noiseRange = (Math.PI / 80) * params.noise;

  // ---------- update() ----------
  for (let i = 0; i < n; i++) {
    const i3 = i * 3;
    let vx = V[i3] + ACC[i3] * delta, vy = V[i3 + 1] + ACC[i3 + 1] * delta, vz = V[i3 + 2] + ACC[i3 + 2] * delta;
    if (drag) { const k = 1 - drag; vx *= k; vy *= k; vz *= k; }
    // noise: 진행 방향을 임의의 수직 축으로 ±noiseRange 회전 (원본 2D rotate의 3D판)
    if (params.noise) {
      const sp = Math.hypot(vx, vy, vz);
      if (sp > 0) {
        const a = (Math.random() * 2 - 1) * noiseRange;
        let ux = Math.random() * 2 - 1, uy = Math.random() * 2 - 1, uz = Math.random() * 2 - 1;
        const fx = vx / sp, fy = vy / sp, fz = vz / sp;
        const d = ux * fx + uy * fy + uz * fz;
        ux -= d * fx; uy -= d * fy; uz -= d * fz;
        const ul = Math.hypot(ux, uy, uz);
        if (ul > 1e-6) {
          const c = Math.cos(a), s = Math.sin(a) * sp / ul;
          vx = vx * c + ux * s; vy = vy * c + uy * s; vz = vz * c + uz * s;
        }
      }
    }
    // 최소 속도
    if (minSpeed > 0.001) {
      const s2 = vx * vx + vy * vy + vz * vz;
      if (s2 === 0) { randomDir(V, i3, minSpeed); vx = V[i3]; vy = V[i3 + 1]; vz = V[i3 + 2]; }
      else if (s2 < minSpeed * minSpeed) { const k = minSpeed / Math.sqrt(s2); vx *= k; vy *= k; vz *= k; }
    }
    // 최대 속도
    {
      const s2 = vx * vx + vy * vy + vz * vz;
      if (s2 > maxSpeed * maxSpeed) { const k = maxSpeed / Math.sqrt(s2); vx *= k; vy *= k; vz *= k; }
    }
    V[i3] = vx; V[i3 + 1] = vy; V[i3 + 2] = vz;
    let x = P[i3] + vx * delta, y = P[i3 + 1] + vy * delta, z = P[i3 + 2] + vz * delta;
    // 경계
    if (params.bounce) {
      let ran = false;
      if (x < 0 || x > W) { ran = true; V[i3] *= -1; }
      if (y < 0 || y > H) { ran = true; V[i3 + 1] *= -1; }
      if (z < 0 || z > D) { ran = true; V[i3 + 2] *= -1; }
      if (ran) { x = Math.min(W, Math.max(0, x)); y = Math.min(H, Math.max(0, y)); z = Math.min(D, Math.max(0, z)); }
    } else {
      x = ((x % W) + W) % W; y = ((y % H) + H) % H; z = ((z % D) + D) % D;
    }
    // 수치 오류 방어 (장시간 전시 안정성)
    if (!(Number.isFinite(x) && Number.isFinite(y) && Number.isFinite(z) && Number.isFinite(V[i3] + V[i3 + 1] + V[i3 + 2]))) {
      resetBoid(i); quat[i].identity(); bank[i] = 0; continue;
    }
    P[i3] = x; P[i3 + 1] = y; P[i3 + 2] = z;
  }

  // ---------- organize() ----------
  organize(n);
  const s = params.vision, sqVis = s * s;
  const accuracy = params.accuracyPower >= 10 ? 0 : 2 ** params.accuracyPower;
  const mouseForce = Math.max((maxSpeed * maxForce * (alignment + cohesion + separation + 1)) / 16, 0);
  const useMouse = params.mouseFollow && mouse.over && performance.now() - mouse.moved < params.choreoIdle * 1000;
  const cw = choreo.w * params.choreoStrength * choreo.pull, sw = choreo.swirl;
  const candS = new Int32Array(27), candE = new Int32Array(27);

  let sumSin = 0, sumCos = 0;
  for (let i = 0; i < n; i++) {
    const i3 = i * 3;
    const px = P[i3], py = P[i3 + 1], pz = P[i3 + 2];
    const vx = V[i3], vy = V[i3 + 1], vz = V[i3 + 2];
    let accx = 0, accy = 0, accz = 0;

    if (s > 0) {
      // ---------- neighbors(): 주변 27칸 후보 중 accuracy개 표본 ----------
      const cx = Math.floor(px / s), cy = Math.floor(py / s), cz = Math.floor(pz / s);
      let nc = 0, total = 0;
      for (let dz = -1; dz <= 1; dz++) {
        const zz = cz + dz; if (zz < 0 || zz >= gLays) continue;
        for (let dy = -1; dy <= 1; dy++) {
          const yy = cy + dy; if (yy < 0 || yy >= gRows) continue;
          for (let dx = -1; dx <= 1; dx++) {
            const xx = cx + dx; if (xx < 0 || xx >= gCols) continue;
            const h = (zz * gRows + yy) * gCols + xx;
            if (cellStart[h + 1] > cellStart[h]) { candS[nc] = cellStart[h]; candE[nc] = cellStart[h + 1]; total += candE[nc] - candS[nc]; nc++; }
          }
        }
      }
      const step = accuracy === 0 ? 1 : Math.max(1, Math.ceil(total / accuracy));
      let k = Math.floor(Math.random() * step);

      // ---------- flock() ----------
      let cnt = 0;
      let alx = 0, aly = 0, alz = 0, csx = 0, csy = 0, csz = 0, spx = 0, spy = 0, spz = 0;
      for (let c = 0; c < nc; c++) {
        const len = candE[c] - candS[c];
        for (; k < len; k += step) {
          const j = sorted[candS[c] + k];
          if (j === i) continue;
          const j3 = j * 3;
          const ox = px - P[j3], oy = py - P[j3 + 1], oz = pz - P[j3 + 2];
          const d2 = ox * ox + oy * oy + oz * oz;
          if (d2 >= sqVis) continue;
          cnt++;
          const ovx = V[j3], ovy = V[j3 + 1], ovz = V[j3 + 2];
          // 정렬: 이웃 속도 × bias^(속도 내적)
          const b = bias ** Math.min(300, ovx * vx + ovy * vy + ovz * vz);
          alx += ovx * b; aly += ovy * b; alz += ovz * b;
          // 응집: 이웃 위치 평균
          csx += P[j3]; csy += P[j3 + 1]; csz += P[j3 + 2];
          // 분리: 가까울수록 강하게 (1/d²)
          const w = 1 / (d2 || 0.00001);
          spx += ox * w; spy += oy * w; spz += oz * w;
        }
        k -= len;
      }
      if (cnt > 0) {
        steerTo(alx, aly, alz, vx, vy, vz, maxSpeed, maxForce);
        accx += _st[0] * alignment; accy += _st[1] * alignment; accz += _st[2] * alignment;
        steerTo(csx / cnt - px, csy / cnt - py, csz / cnt - pz, vx, vy, vz, maxSpeed, maxForce);
        accx += _st[0] * cohesion; accy += _st[1] * cohesion; accz += _st[2] * cohesion;
        steerTo(spx, spy, spz, vx, vy, vz, maxSpeed, maxForce);
        accx += _st[0] * separation; accy += _st[1] * separation; accz += _st[2] * separation;
      }
    }

    // ---------- interact(): 마우스 ----------
    // 원본: 왼쪽 버튼을 누르면 끌어당김, 오른쪽 버튼은 밀어냄.
    // 여기서는 '따라가기'를 위해 마우스가 화면 위에 있으면 끌어당기고, 오른쪽 버튼을 누르면 밀어냄.
    if (useMouse || (mouse.down && mouse.button === 2)) {
      let mx = mouse.x - px, my = mouse.y - py, mz = mouse.z - pz;
      const d = mx * mx + my * my + mz * mz;
      const mag = 10000 / (d || 1);
      const l = Math.sqrt(d) || 1;
      let q = mag / l;
      mx *= q; my *= q; mz *= q;
      const m2 = mx * mx + my * my + mz * mz;
      if (m2 > mouseForce * mouseForce) { const r = mouseForce / Math.sqrt(m2); mx *= r; my *= r; mz *= r; }
      if (mouse.down && mouse.button === 2) { accx -= mx; accy -= my; accz -= mz; }
      else { accx += mx; accy += my; accz += mz; }
    }
    // ---------- 군무: 리더를 향해 + 리더 주위를 돎 ----------
    if (cw > 0.001) {
      let lx = choreo.x, ly = choreo.y, lz = choreo.z;
      if (choreo.trail > 0) { leaderAt(choreo.t - lag[i] * choreo.trail); lx = _lp[0]; ly = _lp[1]; lz = _lp[2]; }
      const tx = lx - px, ty = ly - py, tz = lz - pz;
      const tl = Math.hypot(tx, ty, tz) || 1;
      // 화면 평면(시뮬레이션 z축) 둘레의 접선 방향
      const ux = -ty / tl, uy = tx / tl;
      // 멀리 있을수록 곧장 모이고, 가까우면 주위를 돈다
      const near = Math.min(1, tl / (params.vision * 1.2));
      const dx = (tx / tl) * near + ux * sw, dy = (ty / tl) * near + uy * sw, dz = (tz / tl) * near;
      steerTo(dx, dy, dz, vx, vy, vz, maxSpeed, maxForce);
      accx += _st[0] * cw; accy += _st[1] * cw; accz += _st[2] * cw;
    }
    // 더블클릭 폭발
    if (explode > 0.001) {
      let ex = explodePos[0] - px, ey = explodePos[1] - py, ez = explodePos[2] - pz;
      const d = ex * ex + ey * ey + ez * ez;
      const l = Math.sqrt(d) || 1;
      const q = (explode * 100000) / (d || 1) / l;
      ex *= q; ey *= q; ez *= q;
      const m2 = ex * ex + ey * ey + ez * ez, lim = mouseForce * 3;
      if (m2 > lim * lim) { const r = lim / Math.sqrt(m2); ex *= r; ey *= r; ez *= r; }
      accx -= ex; accy -= ey; accz -= ez;
    }

    ACC[i3] = accx; ACC[i3 + 1] = accy; ACC[i3 + 2] = accz;
    sumSin += Math.sin(phase[i]); sumCos += Math.cos(phase[i]);
  }
  if (explode > 0.001) explode *= 0.9; else explode = 0;
  globalSin = sumSin; globalCos = sumCos;
}

// ---- 자세 (접지선을 진행 방향에 정렬 + 선회 시 기울기) + 날갯짓 -------
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new THREE.Vector3();
const _p = new THREE.Vector3(), _x = new THREE.Vector3(), _y = new THREE.Vector3(), _z = new THREE.Vector3(), _up = new THREE.Vector3();
function updateInstances(dt) {
  const n = params.count;
  const meanPhase = Math.atan2(globalSin, globalCos);
  const kSync = 6 * params.sync;
  const maxA = THREE.MathUtils.degToRad(params.maxAngle);
  const rotK = 1 - Math.exp(-dt * 10);
  const bankK = 1 - Math.exp(-dt * 4);
  const ampK = 1 - Math.exp(-dt * 2.5);
  const arr = mesh.instanceMatrix.array;
  const hx = dims[0] / 2, hy = dims[1] / 2, hz = dims[2] / 2;
  const mf = Math.max(params.maxForce, 1e-3);
  _s.setScalar(params.scale);

  const M = SIM_M, wpp = worldPerPx();
  // 시뮬레이션 축 → world 회전
  const rx = (x, y, z) => M[0] * x + M[3] * y + M[6] * z;
  const ry = (x, y, z) => M[1] * x + M[4] * y + M[7] * z;
  const rz = (x, y, z) => M[2] * x + M[5] * y + M[8] * z;

  for (let i = 0; i < n; i++) {
    const i3 = i * 3;
    const sx = V[i3], sy = V[i3 + 1], sz = V[i3 + 2];
    const vx = rx(sx, sy, sz), vy = ry(sx, sy, sz), vz = rz(sx, sy, sz);
    const sp = Math.hypot(vx, vy, vz) || 1;
    const fx = vx / sp, fy = vy / sp, fz = vz / sp;          // 진행 방향 (world)
    const qx = ACC[i3], qy = ACC[i3 + 1], qz = ACC[i3 + 2];  // px/frame²
    const ax = rx(qx, qy, qz), ay = ry(qx, qy, qz), az = rz(qx, qy, qz);

    // 로컬 축: z = −진행방향, x = 오른쪽 페이지, y = 앞면 법선
    _z.set(-fx, -fy, -fz);
    _x.set(0, 1, 0).cross(_z);
    if (_x.lengthSq() < 1e-6) _x.fromArray(prevRight, i3); else _x.normalize();
    // 선회 방향 가속 → 기울기 (오른쪽으로 돌면 오른쪽 날개가 내려감)
    const lateral = (ax * _x.x + ay * _x.y + az * _x.z) / mf;
    const bankT = THREE.MathUtils.clamp(lateral * 0.5, -1.1, 1.1);
    bank[i] += (bankT - bank[i]) * bankK;
    _up.set(0, 1, 0).multiplyScalar(Math.cos(bank[i])).addScaledVector(_x, Math.sin(bank[i]));
    _x.crossVectors(_up, _z);
    if (_x.lengthSq() < 1e-6) _x.fromArray(prevRight, i3); else _x.normalize();
    _x.toArray(prevRight, i3);
    _y.crossVectors(_z, _x);
    _m.makeBasis(_x, _y, _z);
    _q.setFromRotationMatrix(_m);
    quat[i].slerp(_q, rotK);

    const lx = (P[i3] - hx) * wpp, ly = (P[i3 + 1] - hy) * wpp, lz = (P[i3 + 2] - hz) * wpp;
    _p.set(rx(lx, ly, lz), ry(lx, ly, lz), rz(lx, ly, lz));
    _m.compose(_p, quat[i], _s);
    _m.toArray(arr, i * 16);

    // 날갯짓: 상승·가속할수록 크고 빠르게, 하강할 때는 작게(활공)
    const thrust = THREE.MathUtils.clamp((ax * fx + ay * fy + az * fz) / mf, -1, 1);
    const ampT = THREE.MathUtils.clamp(0.6 + 0.9 * fy + 0.35 * thrust + 0.15 * Math.abs(bank[i]), 0.12, 1.25);
    ampS[i] += (ampT - ampS[i]) * ampK;
    const freq = params.frequency * (1 + params.freqVar * uFreq[i]) * (0.8 + 0.3 * ampS[i]) * (0.7 + 0.3 * sp / Math.max(params.maxSpeed, 1e-3));
    phase[i] += TAU * freq * dt + kSync * Math.sin(meanPhase - phase[i]) * dt;
    if (phase[i] > 1e4) phase[i] -= TAU * 1000;
    const off = params.phaseVar * (1 - params.sync) * uPhase[i] * TAU;
    aAngle.array[i] = maxA * (1 + 0.15 * uAmp[i]) * ampS[i] * wave(phase[i] + off);
  }
  mesh.instanceMatrix.needsUpdate = true;
  aAngle.needsUpdate = true;
}

// 앞면 타입 A–F 업로드

const slots = TYPE_LETTERS.map((letter) => ({ letter, name: '—', loaded: false }));
const MAX_DECODE = 4096;
const IMAGE_EXT = /\.(jpe?g|png|webp|gif|bmp|avif)$/i;
const isImageFile = (f) => !!f && ((f.type && f.type.startsWith('image/')) || IMAGE_EXT.test(f.name));

function decodeImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode failed')); };
    img.src = url;
  });
}
const layerCanvas = document.createElement('canvas');
layerCanvas.width = LAYER_W; layerCanvas.height = LAYER_H;
const lctx = layerCanvas.getContext('2d', { willReadFrequently: true });

// 이미지를 레이어에 비율 유지로 배치 (늘리지 않음). 남는 부분은 종이 흰색.
function writeLayer(layer, img) {
  lctx.setTransform(1, 0, 0, 1, 0, 0);
  lctx.fillStyle = '#fff';
  lctx.fillRect(0, 0, LAYER_W, LAYER_H);
  if (img) {
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const k = Math.min(LAYER_W / iw, LAYER_H / ih);
    const w = iw * k, h = ih * k;
    // 3D 텍스처는 flipY가 없으므로 위아래를 뒤집어 그린다
    lctx.translate(0, LAYER_H);
    lctx.scale(1, -1);
    lctx.imageSmoothingQuality = 'high';
    lctx.drawImage(img, (LAYER_W - w) / 2, (LAYER_H - h) / 2, w, h);
  }
  const px = lctx.getImageData(0, 0, LAYER_W, LAYER_H).data;
  layerData.set(px, layer * LAYER_W * LAYER_H * 4);
  texArray.needsUpdate = true;
}
function reassignTypes() {
  const loaded = slots.map((s, i) => (s.loaded ? i : -1)).filter((i) => i >= 0);
  for (let i = 0; i < MAX; i++) {
    aType.array[i] = loaded.length ? loaded[Math.floor(uType[i] * loaded.length)] : -1;
  }
  aType.needsUpdate = true;
  typeControllers.forEach((c) => c.updateDisplay());
}
async function setTypeImage(index, file) {
  if (!file) return;
  if (!isImageFile(file)) { toast(`이미지 파일이 아닙니다: ${file.name}`, true); return; }
  try {
    const img = await decodeImage(file);
    if (!img.naturalWidth) throw new Error('size');
    writeLayer(index, img);
    slots[index].loaded = true;
    slots[index].name = file.name;
    reassignTypes();
    toast(`타입 ${TYPE_LETTERS[index]}: ${file.name}`);
  } catch (e) {
    console.error(e);
    slots[index].loaded = slots[index].name !== '—';
    toast(`타입 ${TYPE_LETTERS[index]} 이미지를 불러오지 못했습니다 (${file.name})`, true);
  }
}
function clearType(index) {
  writeLayer(index, null);
  slots[index].loaded = false;
  slots[index].name = '—';
  reassignTypes();
}

const fileInput = document.createElement('input');
fileInput.type = 'file';
fileInput.accept = 'image/*,.jpg,.jpeg,.png,.webp';
fileInput.style.display = 'none';
document.body.appendChild(fileInput);
let pendingType = 0;
fileInput.addEventListener('change', () => {
  const f = fileInput.files && fileInput.files[0];
  fileInput.value = '';
  setTypeImage(pendingType, f);
});
function pickType(index) { pendingType = index; fileInput.click(); }

// 드롭: 여러 장이면 빈 타입부터 차례로 채움 (빈 타입이 없으면 A부터 덮어씀)
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', async (e) => {
  e.preventDefault();
  const files = [...e.dataTransfer.files].filter(isImageFile);
  let cursor = 0;
  for (const f of files) {
    let idx = slots.findIndex((s, i) => i >= cursor && !s.loaded);
    if (idx < 0) idx = cursor % slots.length;
    cursor = idx + 1;
    slots[idx].loaded = true; // 순서 예약
    await setTypeImage(idx, f);
  }
});

const toastEl = document.createElement('div');
toastEl.id = 'toast';
document.body.appendChild(toastEl);
let toastTimer;
function toast(msg, isError = false) {
  toastEl.textContent = msg;
  toastEl.classList.toggle('err', isError);
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), isError ? 6000 : 2500);
}

// =====================================================================
const gui = new GUI({ title: 'Spread Flock' });
const fS = gui.addFolder('크기 · 간격');
fS.add(params, 'scale', 0.1, 2, 0.01).name('스프레드 크기').onChange(rescaleSpace);
fS.add(params, 'spacing', 0.5, 5, 0.01).name('개체 간격').onChange(rescaleSpace);

const fF = gui.addFolder('군집 (기존 bodies 모델)');
fF.add(params, 'count', 1, MAX, 1).name('개체 수').onChange((v) => {
  for (let i = mesh.count; i < v; i++) resetBoid(i); // 새로 생긴 개체는 원본처럼 임의 위치에서 시작
  mesh.count = v;
});
fF.add(params, 'maxSpeed', 0, 20, 0.1).name('이동 속도 (maxSpeed)');
fF.add(params, 'minSpeed', 0, 10, 0.1).name('최소 속도 (minSpeed)');
fF.add(params, 'maxForce', 0, 2, 0.01).name('최대 회전 속도 (maxForce)');
fF.add(params, 'separation', 0, 5, 0.01).name('분리 강도');
fF.add(params, 'alignment', 0, 5, 0.01).name('정렬 강도');
fF.add(params, 'bias', 1, 3, 0.01).name('정렬 편향 (bias)');
fF.add(params, 'cohesion', 0, 5, 0.01).name('응집 강도');
fF.add(params, 'vision', 10, 200, 1).name('주변 인식 반경 (vision)');
fF.add(params, 'drag', 0, 0.1, 0.001).name('감쇠 (drag)');
fF.add(params, 'noise', 0, 5, 0.01).name('노이즈 (noise)');
fF.add(params, 'accuracyPower', 0, 10, 1).name('이웃 표본 2^n (10=전부)');
fF.add(params, 'space', 0.3, 2, 0.01).name('활동 공간 크기 (1 = 화면)').onChange(rescaleSpace);
fF.add(params, 'bounce').name('경계에서 튕김 (끄면 반대편으로)');
fF.add(params, 'mouseFollow').name('마우스 따라가기');
fF.add({ f() { for (let i = 0; i < MAX; i++) resetBoid(i); } }, 'f').name('다시 흩뿌리기');

const fC = gui.addFolder('군무 (마우스가 쉴 때)');
fC.add(params, 'choreo').name('군무 켜기');
fC.add(params, 'choreoIdle', 0.5, 20, 0.5).name('마우스 멈춘 뒤 (초)');
fC.add(params, 'choreoStrength', 0, 3, 0.01).name('모이는 힘');
fC.add(params, 'choreoSpeed', 0, 4, 0.01).name('리더 속도');
fC.add(params, 'choreoRange', 0, 1, 0.01).name('움직임 범위');
fC.add(params, 'choreoTrail', 0, 15, 0.1).name('꼬리 길이 (늘어짐)');
fC.add(params, 'choreoSwirl', 0, 2, 0.01).name('소용돌이');
fC.add(params, 'choreoBreath', 0, 60, 1).name('모임·흩어짐 주기 (초, 0=끔)');

const fW = gui.addFolder('날갯짓');
fW.add(params, 'maxAngle', 0, 85, 1).name('최대 접힘 각도 (°)');
fW.add(params, 'frequency', 0, 5, 0.01).name('날갯짓 빈도 (Hz)');
fW.add(params, 'phaseVar', 0, 1, 0.01).name('개체별 위상 차이');
fW.add(params, 'freqVar', 0, 0.8, 0.01).name('개체별 속도 편차');
fW.add(params, 'sync', 0, 1, 0.01).name('동기화 정도');
fW.add(params, 'upDownBias', 0, 0.5, 0.01).name('위/아래 비대칭');

const fT = gui.addFolder('앞면 타입');
const typeControllers = [];
TYPE_LETTERS.forEach((letter, i) => {
  typeControllers.push(fT.add(slots[i], 'name').name(`${letter}`).disable());
  fT.add({ f() { pickType(i); } }, 'f').name(`${letter} 업로드 / 교체`);
});
fT.add({ f() { slots.forEach((_, i) => { if (slots[i].loaded) clearType(i); }); } }, 'f').name('모두 제거');
// D–F는 접어 둔 느낌으로: 처음엔 A–C만 보이도록 GUI 간결화
fT.controllers.forEach((c, k) => { if (k >= 6 && k < 12) c.hide(); });
fT.add({ more: false }, 'more').name('D–F 타입 보기').onChange((v) => {
  fT.controllers.forEach((c, k) => { if (k >= 6 && k < 12) (v ? c.show() : c.hide()); });
});

const fV = gui.addFolder('시각 요소');
fV.add(params, 'light', 0, 2, 0.01).name('조명 강도').onChange(applyLight);
fV.addColor(params, 'background').name('배경색').onChange((v) => scene.background.set(v));
fV.add(camera, 'fov', 10, 100, 1).name('카메라 원근감 (FOV)').onChange(() => { camera.updateProjectionMatrix(); rescaleSpace(); });
fV.add({ f() { camera.position.copy(DEFAULT_CAM); controls.target.set(0, 0, 0); } }, 'f').name('카메라 초기화');
fV.close();

// =====================================================================
// 키 / 리사이즈 / 루프
// =====================================================================
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('hide-ui');
  if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  rescaleSpace(); // 창 크기가 바뀌면 활동 공간도 화면에 맞춤
});

let simT = 0;
function frame(dt) {
  simT += dt;
  updateMouse();
  updateChoreo(dt);
  stepBoids(Math.min(dt * 60, 2)); // 원본 ticker delta (60fps = 1, 최대 2)
  updateInstances(dt);
}
if (location.search.includes('debug')) window.__flock = {
  P, V, ACC, mesh, params, camera, aAngle, aType, mouse, dims, choreo,
  // 검증용: 고정 dt로 n프레임 진행
  step(n, dt = 1 / 60) { for (let k = 0; k < n; k++) frame(dt); },
};
reassignTypes();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  // 탭 전환 등으로 프레임이 크게 끊겨도 튀지 않도록 dt 상한
  const dt = THREE.MathUtils.clamp(clock.getDelta(), 1 / 240, 1 / 30);
  controls.update();
  frame(dt);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
